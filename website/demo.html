<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindForge Demo - 记忆系统演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a0f;
  color: #fff;
  font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  overflow: hidden;
}

#canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
}

.overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 2;
  pointer-events: none;
}

/* Back button */
.back-btn {
  position: fixed;
  top: 24px;
  left: 24px;
  z-index: 10;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  background: rgba(26, 26, 37, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 999px;
  color: #a0a0b0;
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: all 0.2s;
  pointer-events: all;
}

.back-btn:hover {
  color: #00d4ff;
  border-color: rgba(0, 212, 255, 0.3);
  background: rgba(0, 212, 255, 0.1);
}

.title-screen {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  opacity: 0;
  animation: fadeIn 2s ease-out forwards;
}

.title-screen h1 {
  font-size: 5rem;
  font-weight: 900;
  background: linear-gradient(135deg, #00d4ff 0%, #a855f7 50%, #f472b6 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 1rem;
  letter-spacing: -2px;
}

.title-screen p {
  font-size: 1.2rem;
  color: #a0a0b0;
  max-width: 500px;
}

.phase {
  position: absolute;
  top: 10%; left: 10%;
  opacity: 0;
  font-size: 0.85rem;
  color: #00d4ff;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 600;
  padding: 8px 16px;
  background: rgba(0, 212, 255, 0.1);
  border: 1px solid rgba(0, 212, 255, 0.2);
  border-radius: 8px;
}

.demo-card {
  position: absolute;
  background: rgba(26, 26, 37, 0.9);
  border: 1px solid rgba(0, 212, 255, 0.2);
  border-radius: 16px;
  padding: 1.5rem;
  opacity: 0;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
}

.demo-card h3 {
  font-size: 1rem;
  color: #00d4ff;
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-weight: 600;
}

.demo-card .content {
  font-size: 0.9rem;
  color: #e0e0e8;
  line-height: 1.6;
}

.demo-card .tags {
  display: flex;
  gap: 0.4rem;
  margin-top: 0.75rem;
  flex-wrap: wrap;
}

.demo-card .tag {
  padding: 0.25rem 0.7rem;
  background: rgba(168, 85, 247, 0.15);
  border: 1px solid rgba(168, 85, 247, 0.2);
  border-radius: 6px;
  font-size: 0.7rem;
  color: #a855f7;
  font-weight: 500;
}

.demo-card .score {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  color: #10b981;
  margin-top: 0.5rem;
  font-weight: 600;
}

.search-box {
  position: absolute;
  bottom: 20%; left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 0.5rem;
  opacity: 0;
}

.search-box input {
  width: 400px;
  padding: 0.85rem 1.2rem;
  background: rgba(26, 26, 37, 0.9);
  border: 1px solid rgba(0, 212, 255, 0.3);
  border-radius: 12px;
  color: #fff;
  font-size: 0.9rem;
  outline: none;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  font-family: inherit;
}

.search-box input::placeholder {
  color: #6b6b80;
}

.search-box button {
  padding: 0.85rem 1.5rem;
  background: linear-gradient(135deg, #00d4ff, #a855f7);
  border: none;
  border-radius: 12px;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: transform 0.2s, box-shadow 0.2s;
}

.search-box button:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
}

.graph-node {
  position: absolute;
  width: 64px; height: 64px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.75rem;
  opacity: 0;
  background: rgba(26, 26, 37, 0.9);
  border: 2px solid rgba(0, 212, 255, 0.4);
  box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.graph-line {
  position: absolute;
  height: 2px;
  background: linear-gradient(90deg, rgba(0, 212, 255, 0.6), rgba(168, 85, 247, 0.6));
  transform-origin: left center;
  opacity: 0;
  box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
}

.layer-stack {
  position: absolute;
  right: 10%; top: 50%;
  transform: translateY(-50%);
  opacity: 0;
}

.layer {
  padding: 1rem 1.5rem;
  background: rgba(26, 26, 37, 0.8);
  border-left: 3px solid;
  margin-bottom: 0.75rem;
  border-radius: 0 12px 12px 0;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  min-width: 180px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

.layer.sensory { border-color: #00d4ff; }
.layer.short-term { border-color: #a855f7; }
.layer.long-term { border-color: #f472b6; }
.layer.permanent { border-color: #10b981; }

.layer span {
  font-size: 0.95rem;
  color: #e0e0e8;
  font-weight: 600;
}

.layer .label {
  font-size: 0.7rem;
  color: #6b6b80;
  display: block;
  margin-top: 0.25rem;
  font-weight: 400;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translate(-50%, -50%) translateY(20px); }
  to { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(1.05); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes glow {
  0%, 100% { box-shadow: 0 0 20px rgba(0, 212, 255, 0.3); }
  50% { box-shadow: 0 0 40px rgba(0, 212, 255, 0.6); }
}

.typewriter {
  overflow: hidden;
  border-right: 2px solid #00d4ff;
  animation: typing 3s steps(40) forwards, blink 0.75s step-end infinite;
}

@keyframes typing {
  from { width: 0; }
  to { width: 100%; }
}

@keyframes blink {
  50% { border-color: transparent; }
}

/* Responsive */
@media (max-width: 768px) {
  .title-screen h1 { font-size: 3rem; }
  .search-box input { width: 280px; }
  .demo-card { width: 280px !important; }
  .layer-stack { right: 5%; }
  .layer { min-width: 140px; padding: 0.75rem 1rem; }
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<a href="index.html" class="back-btn">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  返回首页
</a>

<div class="overlay">
  <div class="title-screen" id="titleScreen">
    <h1>MindForge</h1>
    <p>AI Agent 终身记忆系统</p>
  </div>

  <div class="phase" id="phase1">Phase 1: 添加记忆</div>
  <div class="phase" id="phase2">Phase 2: 语义检索</div>
  <div class="phase" id="phase3">Phase 3: 知识关联</div>
  <div class="phase" id="phase4">Phase 4: 多层架构</div>

  <div class="demo-card" id="card1" style="top: 25%; left: 15%; width: 340px;">
    <h3>🧠 新记忆</h3>
    <div class="content">用户喜欢用 Python 进行数据分析，偏好 pandas 和 numpy 库。</div>
    <div class="tags"><span class="tag">preferences</span><span class="tag">python</span><span class="tag">data</span></div>
  </div>

  <div class="demo-card" id="card2" style="top: 55%; left: 15%; width: 340px;">
    <h3>🔍 检索结果</h3>
    <div class="content">用户上周提到需要优化数据库查询性能，建议使用索引。</div>
    <div class="tags"><span class="tag">work</span><span class="tag">database</span><span class="tag">optimization</span></div>
    <div class="score">相似度: 0.89</div>
  </div>

  <div class="search-box" id="searchBox">
    <input type="text" id="searchInput" placeholder="搜索记忆...">
    <button id="searchBtn">搜索</button>
  </div>

  <div class="graph-node" id="node1" style="top: 40%; left: 48%;">🧠</div>
  <div class="graph-node" id="node2" style="top: 28%; left: 62%;">💡</div>
  <div class="graph-node" id="node3" style="top: 55%; left: 68%;">🔗</div>
  <div class="graph-line" id="line1"></div>
  <div class="graph-line" id="line2"></div>

  <div class="layer-stack" id="layerStack">
    <div class="layer permanent"><span>永久记忆</span><span class="label">Permanent</span></div>
    <div class="layer long-term"><span>长期记忆</span><span class="label">Long-term</span></div>
    <div class="layer short-term"><span>短期记忆</span><span class="label">Short-term</span></div>
    <div class="layer sensory"><span>感官记忆</span><span class="label">Sensory</span></div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height;
let particles = [];

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.size = Math.random() * 2 + 0.5;
    this.color = Math.random() > 0.5 ? '#00d4ff' : '#a855f7';
    this.alpha = Math.random() * 0.5 + 0.2;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0 || this.x > width) this.vx *= -1;
    if (this.y < 0 || this.y > height) this.vy *= -1;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = this.alpha;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function initParticles() {
  particles = [];
  const count = Math.min(150, Math.floor(width * height / 10000));
  for (let i = 0; i < count; i++) {
    particles.push(new Particle());
  }
}

function animateParticles() {
  ctx.clearRect(0, 0, width, height);
  particles.forEach(p => {
    p.update();
    p.draw();
  });

  particles.forEach((p1, i) => {
    particles.slice(i + 1).forEach(p2 => {
      const dx = p1.x - p2.x;
      const dy = p1.y - p2.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 120) {
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = `rgba(0, 212, 255, ${0.1 * (1 - dist / 120)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    });
  });

  requestAnimationFrame(animateParticles);
}

function showElement(id, delay = 0, duration = 1000) {
  return new Promise(resolve => {
    setTimeout(() => {
      const el = document.getElementById(id);
      if (el) {
        el.style.transition = `opacity ${duration}ms ease-out, transform ${duration}ms ease-out`;
        el.style.opacity = '1';
        el.style.transform = 'translateY(0)';
      }
      setTimeout(resolve, duration);
    }, delay);
  });
}

function hideElement(id, duration = 500) {
  return new Promise(resolve => {
    const el = document.getElementById(id);
    if (el) {
      el.style.transition = `opacity ${duration}ms ease-out`;
      el.style.opacity = '0';
    }
    setTimeout(resolve, duration);
  });
}

async function runDemo() {
  await showElement('titleScreen');
  await new Promise(r => setTimeout(r, 3000));
  await hideElement('titleScreen');

  await showElement('phase1');
  await showElement('card1', 500);
  await new Promise(r => setTimeout(r, 2500));

  await showElement('phase2', 300);
  await showElement('searchBox', 600);
  await new Promise(r => setTimeout(r, 1000));

  const input = document.getElementById('searchInput');
  input.value = '';
  const text = '关于数据库优化的建议';
  let i = 0;
  const typeInterval = setInterval(() => {
    if (i < text.length) {
      input.value += text[i];
      i++;
    } else {
      clearInterval(typeInterval);
    }
  }, 100);
  await new Promise(r => setTimeout(r, text.length * 100 + 500));

  await showElement('card2', 300);
  await new Promise(r => setTimeout(r, 2500));

  await showElement('phase3', 300);
  await showElement('node1', 500);
  await showElement('node2', 800);
  await showElement('node3', 1100);

  const node1 = document.getElementById('node1');
  const node2 = document.getElementById('node2');
  const node3 = document.getElementById('node3');
  const line1 = document.getElementById('line1');
  const line2 = document.getElementById('line2');

  setTimeout(() => {
    const rect1 = node1.getBoundingClientRect();
    const rect2 = node2.getBoundingClientRect();
    const rect3 = node3.getBoundingClientRect();

    const x1 = rect1.left + rect1.width / 2;
    const y1 = rect1.top + rect1.height / 2;
    const x2 = rect2.left + rect2.width / 2;
    const y2 = rect2.top + rect2.height / 2;
    const x3 = rect3.left + rect3.width / 2;
    const y3 = rect3.top + rect3.height / 2;

    const dx1 = x2 - x1;
    const dy1 = y2 - y1;
    const dx2 = x3 - x2;
    const dy2 = y3 - y2;

    line1.style.left = x1 + 'px';
    line1.style.top = y1 + 'px';
    line1.style.width = Math.sqrt(dx1*dx1 + dy1*dy1) + 'px';
    line1.style.transform = `rotate(${Math.atan2(dy1, dx1)}rad)`;
    line1.style.opacity = '1';

    line2.style.left = x2 + 'px';
    line2.style.top = y2 + 'px';
    line2.style.width = Math.sqrt(dx2*dx2 + dy2*dy2) + 'px';
    line2.style.transform = `rotate(${Math.atan2(dy2, dx2)}rad)`;
    line2.style.opacity = '1';
  }, 1300);

  await new Promise(r => setTimeout(r, 3000));

  await showElement('phase4', 300);
  await showElement('layerStack', 600);
  await new Promise(r => setTimeout(r, 4000));

  await hideElement('phase1');
  await hideElement('phase2');
  await hideElement('phase3');
  await hideElement('phase4');
  await hideElement('card1');
  await hideElement('card2');
  await hideElement('searchBox');
  await hideElement('node1');
  await hideElement('node2');
  await hideElement('node3');
  await hideElement('line1');
  await hideElement('line2');
  await hideElement('layerStack');

  setTimeout(() => {
    runDemo();
  }, 1000);
}

resize();
initParticles();
animateParticles();
window.addEventListener('resize', () => {
  resize();
  initParticles();
});

setTimeout(runDemo, 1000);
</script>
</body>
</html>
